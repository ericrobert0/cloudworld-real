<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · CloudWorld</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5fa;color:#192338;font:16px system-ui,sans-serif}.card{width:100%;max-width:420px;background:white;padding:36px;border:1px solid #e1e6ef;border-radius:20px;box-shadow:0 18px 60px #1923380b}.brand{color:#3158d8;font-weight:800;letter-spacing:.03em}h1{font-size:28px;margin:24px 0 8px}p{color:#657086;line-height:1.5}label{display:block;font-weight:600;margin:20px 0 8px}input{width:100%;padding:13px;border:1px solid #bcc6d6;border-radius:9px;font:inherit}input:focus{outline:3px solid #dce5ff;border-color:#3158d8}button{width:100%;border:0;border-radius:9px;background:#3158d8;color:white;font:600 16px system-ui;padding:14px;margin-top:26px;cursor:pointer}.error{background:#fff0ee;color:#a42c23;padding:12px;border-radius:8px}.foot{font-size:13px;margin-bottom:0}</style></head><body><main class="card"><div class="brand">CloudWorld</div><h1>Entrar no painel</h1><p>Acesse a central de operações do seu ambiente.</p><!-- LOGIN_ERROR --><form method="post" action="/auth/login"><label for="username">Usuário</label><input id="username" name="username" value="admin" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">Entrar</button></form><p class="foot">Acesso restrito ao administrador.</p></main></body></html>
